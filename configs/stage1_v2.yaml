experiment:
  name: ariadne_stage1_v2
  output_dir: experiments/ariadne_stage1_v2
  seed: 3407

stage: stage1_v2
device: cuda

model:
  encoder_size: 256
  patch_size: 16
  hidden_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0

  # One source-grade-sensitive code for the Normalization LUT branch.
  normalization_dim: 128

  # One independent target-style code for the reusable Style LUT branch.
  style_dim: 128

  condition_dim: 384
  lut_channels: 96

  normalization_lut_residual_scale_8: 0.30
  normalization_lut_residual_scale_16: 0.20
  normalization_lut_residual_scale_32: 0.12

  style_lut_residual_scale_8: 0.30
  style_lut_residual_scale_16: 0.20
  style_lut_residual_scale_32: 0.12

data:
  coco_root: /mnt/data/a/mohao/data/coco_tars
  train_split: train
  val_split: valid
  image_size: 256
  batch_size: 8
  num_workers: 8
  shuffle_buffer: 1000
  steps_per_epoch: 3000
  val_steps: 100

augmentation:
  exposure: 0.65
  gamma: 0.32
  contrast: 0.30
  saturation: 0.45
  temperature: 0.18
  tint: 0.12
  channel_mix: 0.08
  split_tone: 0.10
  lift: 0.05
  shoulder: 0.18

loss:
  # Bidirectional cross-grade reconstruction.
  charbonnier: 1.0
  mse: 5.0
  chroma: 0.5
  low_frequency: 0.5
  gradient: 0.05

  # Same content under two grades should enter the same canonical space.
  # The raw canonical Charbonnier distance is penalized only above the margin.
  canonical_consistency: 5.0
  canonical_margin: 0.01

  # Normalization LUT regularization.
  normalization_lut_smoothness: 0.02
  normalization_lut_monotonicity: 0.05
  normalization_lut_range: 0.02

  # Reusable Style LUT regularization.
  style_lut_smoothness: 0.02
  style_lut_monotonicity: 0.05
  style_lut_range: 0.02

validation:
  seed: 12345
  max_visual_items: 2

train:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0
  amp: true
  log_every: 20
  image_every: 300
  checkpoint_every: 1
  resume: ""
