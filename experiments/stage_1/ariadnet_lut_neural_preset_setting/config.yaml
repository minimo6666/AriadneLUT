experiment:
  name: ariadnet_lut_neural_preset_setting
  output_dir: experiments/stage_1/ariadnet_lut_neural_preset_setting/runs/main_gpu2_b24
  seed: 160122

device: cuda

# Keep the Stage-1 V2 predicted-LUT architecture unchanged. The experiment
# changes the data construction and objective to Neural Preset's setting.
model:
  encoder_size: 256
  patch_size: 16
  hidden_dim: 256
  depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  normalization_dim: 128
  style_dim: 128
  condition_dim: 384
  lut_channels: 96
  normalization_lut_residual_scale_8: 0.30
  normalization_lut_residual_scale_16: 0.20
  normalization_lut_residual_scale_32: 0.12
  style_lut_residual_scale_8: 0.30
  style_lut_residual_scale_16: 0.20
  style_lut_residual_scale_32: 0.12

data:
  # These are the exact roots used by Neural-Preset/scripts/train_neural_preset.sh.
  coco_root: /mnt/data/0/mohao/data/coco
  train_split: train
  val_split: valid
  lut_root: /home/minimo/Project/DavinciLUTBaselineComparision/Neural-Preset/datasets/luts
  image_size: 256

  # Neural Preset uses a global batch of 48 (24 on each of two GPUs). Ariadne
  # uses 24 images on one GPU and accumulates two micro-batches for the same
  # effective batch size.
  batch_size: 24
  gradient_accumulation_steps: 2
  num_workers: 8
  pin_memory: true
  persistent_workers: true

  # Neural Preset samples two LUTs independently with replacement.
  deterministic_validation: true
  validation_seed: 160122

loss:
  # Exact Neural Preset objective:
  # L1(A->B, B) + L1(B->A, A) + 10 * MSE(canonical_A, canonical_B)
  lambda_consistency: 10.0

train:
  epochs: 32
  learning_rate: 0.0003
  beta1: 0.9
  beta2: 0.999
  amp: true
  grad_clip: 0.0
  log_every_optimizer_steps: 20
  image_every_optimizer_steps: 500
  checkpoint_every_epochs: 1
  scheduler_step_size: 24
  scheduler_gamma: 0.1
  resume: ""

validation:
  max_visual_items: 2
  # The pair supplied for the blue-invasion check: giraffe content + snowy
  # blue-sky style. Both are kept at fixed paths and evaluated every epoch.
  fixed_content: contents/coco_content_000.png
  fixed_style: styles/coco_style_007.png

