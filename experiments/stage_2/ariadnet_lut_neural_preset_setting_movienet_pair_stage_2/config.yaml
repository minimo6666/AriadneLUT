experiment:
  name: ariadnet_lut_neural_preset_setting_movienet_pair
  output_dir: experiments/stage_2/ariadnet_lut_neural_preset_setting_movienet_pair_stage_2/runs/main_gpu2_5_b160
  seed: 160122

device: cuda

# Frozen Stage-1 starting point. This is the checkpoint shown in the current
# ariadnet_lut_neural_preset_setting run tree.
stage1:
  config: experiments/stage_1/ariadnet_lut_neural_preset_setting/config.yaml
  checkpoint: experiments/stage_1/ariadnet_lut_neural_preset_setting/runs/main_gpu2_b24/checkpoints/best.pth

model:
  # Q_C and Q_S are exact trilinear query fields of Z_C and Z_S in the same
  # 32^3 lattice used by Stage-1 Style LUTs.
  query_dimension: 32

  # Small Z_C encoder: global color-domain condition, deliberately much smaller
  # than the frozen Stage-1 Transformer.
  content_dim: 96
  content_base_channels: 24

  # Residual 3D-LUT refiner.
  condition_dim: 64
  condition_volume_channels: 8
  refiner_channels: 32
  refiner_blocks: 4

  # Delta L = max_delta * tanh(raw_delta). 0.20 is conservative enough to keep
  # Stage-1 as the anchor while still allowing meaningful cross-content repair.
  max_delta: 0.20

data:
  pair_root: /mnt/data/0/mohao/data/MovieNet/AriadnetLUT/qwen_proxy_100k_v1
  train_manifest: pairs_100k_train.jsonl
  val_manifest: pairs_100k_valid.jsonl
  test_manifest: pairs_100k_test.jsonl

  # Use the SAME LUT distribution as Stage-1 for color corruption so the frozen
  # normalizer is not exposed to a new corruption domain.
  lut_root: /home/minimo/Project/DavinciLUTBaselineComparision/Neural-Preset/datasets/luts/cubes

  image_size: 256
  batch_size: 160
  gradient_accumulation_steps: 1
  num_workers: 24
  pin_memory: true
  persistent_workers: true

  # Dataset implementation should deterministically choose validation LUTs.
  validation_seed: 12345
  # Avoid impossible GT caused by severe LUT clipping; resample a corruption
  # when clipped pixels exceed this fraction. Codex should implement this.
  max_corruption_clipped_fraction: 0.02
  max_corruption_resample_attempts: 10

loss:
  # Exact movie-frame GT is the primary signal.
  charbonnier: 1.0
  # Auxiliary perceptual term. Keep below the exact pixel/color terms.
  lpips: 0.20
  lpips_net: alex
  # Explicitly emphasize global grading / low-frequency color.
  low_frequency: 0.50
  low_frequency_kernel: 16
  color_moments: 0.50

  # Conservative residual-LUT regularization.
  delta_l2: 0.01
  delta_smooth: 0.05
  final_lut_curvature: 0.05
  lut_range: 1.0

train:
  epochs: 20
  learning_rate: 0.0002
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0001
  grad_clip: 2.0
  amp: true

  # Local CUDA indices after CUDA_VISIBLE_DEVICES=2,3,4,5 in the launcher.
  # The global pair batch of 160 is split to 40 pairs per GPU.
  data_parallel_device_ids: [0, 1, 2, 3]

  # Smooth initialization: head is zero-initialized AND residual contribution
  # is ramped from 0 -> 1 for the first optimizer steps.
  residual_ramp_steps: 100
  lr_warmup_steps: 50
  min_lr_ratio: 0.10

  log_every: 20
  image_every: 250
  # best.pth is updated on validation improvement and latest.pth is overwritten
  # after every epoch. Add human-numbered epochs here only when milestones are
  # explicitly wanted, e.g. [10, 20] for a 30-epoch run.
  checkpoint_milestone_epochs: []
  resume: ""

validation:
  max_visual_items: 2
